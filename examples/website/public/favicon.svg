<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 34" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .stroke { stroke: #ededed; stroke-width: 1.5; }
    .filled { fill: #ededed; }
    .hollow { fill: #0a0a0a; stroke: #ededed; stroke-width: 1.5; }
    @media (prefers-color-scheme: light) {
      .stroke { stroke: #0a0a0a; }
      .filled { fill: #0a0a0a; }
      .hollow { fill: #ffffff; stroke: #0a0a0a; }
    }
  </style>
  <line x1="8"  y1="17" x2="40"   y2="17"   class="stroke" />
  <line x1="24" y1="17" x2="35.3" y2="28.3" class="stroke" />
  <line x1="40" y1="17" x2="51.3" y2="5.7"  class="stroke" />
  <circle cx="8"    cy="17"   r="3" class="filled" />
  <circle cx="24"   cy="17"   r="3" class="filled" />
  <circle cx="35.3" cy="28.3" r="3" class="filled" />
  <circle cx="40"   cy="17"   r="3" class="hollow" />
  <circle cx="51.3" cy="5.7"  r="3" class="hollow" />
</svg>
