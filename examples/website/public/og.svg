<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Source for og.png (1200×630). Export to PNG with Geist available.
       Palette: ink #0a0a0a · bone #ededed · bone-dim #8a8a8a · accent #c4553a -->
  <rect width="1200" height="630" fill="#0a0a0a" />
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#1f1f1f" stroke-width="1" />

  <!-- Brand: mark + wordmark (smaller) -->
  <g transform="translate(96, 90)">
    <g fill="none" stroke="#ededed" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" transform="scale(1.35)">
      <line x1="8" y1="17" x2="40" y2="17" />
      <line x1="24" y1="17" x2="35.3" y2="28.3" />
      <line x1="40" y1="17" x2="51.3" y2="5.7" />
      <circle cx="8" cy="17" r="3" fill="#ededed" />
      <circle cx="24" cy="17" r="3" fill="#ededed" />
      <circle cx="35.3" cy="28.3" r="3" fill="#ededed" />
      <circle cx="40" cy="17" r="3" fill="#0a0a0a" />
      <circle cx="51.3" cy="5.7" r="3" fill="#0a0a0a" />
    </g>
    <text x="86" y="31" font-family="'Geist Mono', ui-monospace, monospace" font-size="27" fill="#ededed">routini</text>
  </g>

  <!-- Accent rule -->
  <rect x="98" y="224" width="56" height="4" fill="#c4553a" />

  <!-- Headline (tighter line spacing) -->
  <text x="94" y="338" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" font-size="96" font-weight="500" letter-spacing="-3" fill="#ededed">Routing.</text>
  <text x="94" y="428" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" font-size="96" font-weight="500" letter-spacing="-3" fill="#8a8a8a">Nothing else.</text>

  <!-- Sub (smaller + dimmer) -->
  <text x="98" y="494" font-family="'Geist Mono', ui-monospace, monospace" font-size="22" fill="#777777">Under 2 KB · TypeScript-first · Lazy routes built in.</text>

  <!-- URL -->
  <text x="1104" y="566" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace" font-size="22" fill="#4a4a4a">routini.dev</text>
</svg>
