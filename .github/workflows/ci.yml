name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` enforces the lockfile (fails on any package.json/lock drift),
      # but on a cold cache it silently skips the platform-specific rolldown
      # native binding vitest needs at runtime (npm/cli#4828). The follow-up
      # `npm install` installs that one optional binding without touching the
      # already-satisfied lockfile.
      - name: Install
        run: npm ci
      - name: Install platform optional deps (rolldown native binding)
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck -w packages/routini

      - name: Lint
        run: npm run lint -w packages/routini

      - name: Test
        run: npm test -w packages/routini

      - name: Build
        run: npm run build -w packages/routini

      - name: publint
        run: npm run check:exports -w packages/routini
